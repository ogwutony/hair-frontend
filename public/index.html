<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Viewport tag ensures your app scales correctly on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="A description of my awesome application" />
    
    <!-- Link to your favicon (the icon on the browser tab) -->
    <!-- Note: If not using Create React App, replace %PUBLIC_URL% with / -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    
    <!-- Manifest for Progressive Web Apps (PWA) -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <title>My App Title</title>
  </head>
  <body>
    <!-- Fallback for users who have JavaScript disabled -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <!-- The root node where your JavaScript framework will mount the application -->
    <div id="root"></div>
    
    <!-- If you are using Vite, you will also need to include your main script here: -->
    <!-- <script type="module" src="/src/main.jsx"></script> -->
  </body>
</html>
